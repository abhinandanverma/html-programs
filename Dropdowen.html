<!DOCTYPE html>
<html>
<head>
    <title>Dropdown List</title>
</head>

<body>

    <!-- Page heading -->
    <h1>Student Form</h1>

    <form>

        <!-- Dropdown ka label -->
        <label>Select Your Course:</label>

        <!-- Dropdown start -->
        <select>

            <!-- Dropdown options -->
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Tech</option>
            <option>MCA</option>

        </select>

        <br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
