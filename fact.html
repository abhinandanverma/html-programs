<html>
<head> </head>
<body style="text-align: center; font-size: 20px">
    <h1>Sum of Digits in JavaScript</h1>
    Enter a number: <input id="num" /> <br /><br />
    <button onclick="sumOfDigits()">Calculate Sum</button>
    <p id="res"></p>
    
    <script>
        function sumOfDigits() {
            let num = document.getElementById("num").value;
            let sum = 0;
            
            // Input ko string ki tarah iterate karke digits ka sum nikalna
            for (let i = 0; i < num.length; i++) {
                sum += Number(num[i]);
            }
            
            document.getElementById("res").innerHTML = 
                "The sum of digits of " + num + " is: " + sum;
        }
    </script>
</body>
</html>
