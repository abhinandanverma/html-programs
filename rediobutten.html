<!DOCTYPE html>
<html>
<head>
    <title>Radio and Checkbox</title>
</head>

<body>

    <!-- Page heading -->
    <h1>Student Form</h1>

    <form>

        <!-- Radio Button: Sirf ek option select karne ke liye -->
        <label>Gender:</label>

        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        Female

        <br><br>

        <!-- Checkbox: Ek ya multiple options select karne ke liye -->
        <label>Skills:</label>

        <input type="checkbox" name="skill" value="html">
        HTML

        <input type="checkbox" name="skill" value="css">
        CSS

        <input type="checkbox" name="skill" value="python">
        Python

        <br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
