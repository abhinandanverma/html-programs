<!DOCTYPE html>
<html>
<head>
    <title>Radio Button and Checkbox</title>
</head>

<body>

    <!-- Form ka heading -->
    <h1>Student Form</h1>

    <form>

        <!-- Radio Button -->
        <label>Gender:</label>

        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        Female

        <br><br>


        <!-- Checkbox -->
        <label>Languages:</label>

        <input type="checkbox" name="language" value="html">
        HTML

        <input type="checkbox" name="language" value="css">
        CSS

        <input type="checkbox" name="language" value="python">
        Python

        <br><br>


        <!-- Submit Button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
