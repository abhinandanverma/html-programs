<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>
    
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        
        .header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
        
        .menu {
            background-color: lightgray;
            padding: 10px;
            text-align: center;
        }
        
        .menu a {
            text-decoration: none;
            margin: 15px;
            color: black;
        }
        
        .menu a:hover {
            color: red;
        }
        
        .content {
            padding: 20px;
        }
        
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse; /* border chipkaane ke liye */
        }
        
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        
        th {
            background-color: green;
            color: white;
        }
        
        .footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <div class="header">
        <h1>AKTU College</h1>
    </div>
    
    <!-- MENU -->
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
    
    <!-- CONTENT -->
    <div class="content">
        <h2 align="center">Student Result</h2>
        
        <table>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>Web Tech</td>
                <td>90</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Aman</td>
                <td>Web Tech</td>
                <td>85</td>
            </tr>
        </table>
    </div>
    
    <!-- FOOTER -->
    <div class="footer">
        <p>© 2026 AKTU. All Rights Reserved</p>
    </div>
</body>
</html>
