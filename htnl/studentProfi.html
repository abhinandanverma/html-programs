<!DOCTYPE html>
<html>
<head>
    <title>My Web Page</title>
    
    <!-- INTERNAL CSS -->
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }
        
        .box {  /* CSS CLASS */
            background-color: white;
            width: 300px;
            margin: 50px auto; /* center me lane ke liye */
            padding: 20px;
            border: 2px solid blue;
            border-radius: 10px; /* gol kone */
        }
        
        h1 {
            color: darkblue;
        }
        
        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        
        button:hover { /* Pseudo class */
            background-color: darkblue;
        }
    </style>
</head>

<body>
    <!-- HTML CONTENT -->
    <div class="box">  <!-- DIV for grouping -->
        <h1>Welcome to My Page</h1>
        <p>My Name is Rahul</p>
        <p>Roll No: 101</p>
        <img src="photo.jpg" width="100" height="100">
        <br><br>
        <button onclick="alert('Hello')">Click Me</button>
    </div>
</body>
</html>
