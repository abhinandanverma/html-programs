
<!DOCTYPE html>
<html>
<head>
    <!-- Browser tab ka title -->
    <title>Student Marksheet</title>
</head>

<body>

    <!-- Marksheet ki heading -->
    <h1>Student Marksheet</h1>

    <!-- Table start -->
    <table border="1">

        <!-- Table ki heading row -->
        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <!-- English ke marks -->
        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <!-- Computer ke marks -->
        <tr>
            <td>Computer</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <!-- Mathematics ke marks -->
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <!-- Total marks -->
        <tr>
            <th>Total</th>
            <th>300</th>
            <th>253</th>
        </tr>

    </table>

</body>
</html>
