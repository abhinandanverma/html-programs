  <body style="background-color: chocolate">
    <h1 style="background-color: red;width: fit-content;">Register Form:</h1>
    <p>Please fill out the form</p>
    <hr />
    <form>
      <h2 style="background-color: red; width: fit-content;">Person Details:</h2>
      <label>First Name:</label>
      <input type="text" placeholder="e.g:Ahinandan" /><br /><br />

      <label>Last Name:</label>
      <input type="text" placeholder="e.g:verma" /><br /><br />

      <label>Dob:</label>
      <input type="date" /><br /><br />
      <h3 style="background-color: red; width: fit-content;">Gender:</h3>
      <label for="Male">Male</label>
      <input type="radio" name="gender" id="Male" value="Male" /><br>

      <label for="FeMale">FeMale</label>
      <input type="radio" name="gender" id="FeMale" value="FeMale" /><br>

      <label for="Other">Other</label>
      <input type="radio" name="gender" id="Other" velue="other" /><br>
      <br /><br />
      <h3 style="background-color: red; width: fit-content;"> UPload Your photo:</h3>
      <input type="file" style="background-color: brown;">
      <hr>
      <h2 style="background-color: rgb(252, 3, 3); width: fit-content;">Contact Information:</h2>
      <label>Email Address:</label>
      <input type="email"><br> <br>

      <label>phon Number:</label>
      <input type="tel"> <br> <br>

      <label style="background-color:red;">Mailing Address: </label> <br>
      <textarea name="Address" rows ="20" cols="30"></textarea>
      

    </form>
  </body>
</html>
