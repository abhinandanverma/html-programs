<!DOCTYPE html>
<html>

<head>
    <!-- Browser tab ka title -->
    <title>Student Registration Form</title>
</head>

<body>

    <!-- Form ki heading -->
    <h1>Student Registration Form</h1>

    <!-- Form start -->
    <form>

        <!-- Name input -->
        Name:
        <input type="text">
        <br><br>

        <!-- Email input -->
        Email:
        <input type="email">
        <br><br>

        <!-- Password input -->
        Password:
        <input type="password">
        <br><br>

        <!-- Gender select karne ke liye -->
        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit">

        <!-- Reset button -->
        <input type="reset" value="Reset">

    </form>
    <!-- Form end -->

</body>
</html>
