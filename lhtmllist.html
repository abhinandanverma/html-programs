
<!DOCTYPE html>
<html>
<head>
    <!-- Browser tab ka title -->
    <title>HTML List</title>
</head>

<body>

    <!-- Main heading -->
    <h1>My Learning List</h1>

    <!-- Ordered List: Number wali list -->
    <h2>My Subjects</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ol>

    <!-- Unordered List: Bullet wali list -->
    <h2>My Hobbies</h2>

    <ul>
        <li>Coding</li>
        <li>Playing Cricket</li>
        <li>Reading Books</li>
    </ul>

</body>
</html>
