<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
<style>
  body {
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
  }
  .form-container {
    width: 450px;
    background-color: #b5651d; /* brown background */
    padding: 10px;
    margin: 20px auto;
  }
  fieldset {
    border: 1px solid #8b4513;
    margin-bottom: 15px;
    padding: 15px;
  }
  legend {
    background-color: #8b4513;
    color: white;
    padding: 5px 10px;
    font-weight: bold;
  }
  .row {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
  }
  label {
    width: 140px;
    color: white;
    font-weight: bold;
    text-align: right;
    margin-right: 10px;
  }
  input[type="text"],
  input[type="password"],
  select {
    padding: 3px;
    border: 1px solid #777;
  }
  .submit-container {
    text-align: center;
    margin-top: 15px;
  }
  input[type="submit"] {
    background-color: #00cc00;
    color: white;
    font-weight: bold;
    padding: 5px 15px;
    border: 1px solid #006600;
    cursor: pointer;
  }
  .radio-group label,
  .birthday-group label {
    width: auto;
    font-weight: normal;
    color: white;
    margin-right: 15px;
    margin-left: 2px;
  }
  .radio-group, .birthday-group {
    display: inline-block;
  }
</style>
</head>
<body>

<div class="form-container">
  <form>
    <!-- Personal Information Section -->
    <fieldset>
      <legend>Personal Information</legend>
      
      <div class="row">
        <label>Sex:</label>
        <div class="radio-group">
          <input type="radio" id="male" name="sex" value="male">
          <label for="male">Male</label>
          <input type="radio" id="female" name="sex" value="female">
          <label for="female">Female</label>
        </div>
      </div>

      <div class="row">
        <label>Birthday:</label>
        <div class="birthday-group">
          <select name="month">
            <option>Month:</option>
          </select>
          <select name="date">
            <option>Date:</option>
          </select>
          <select name="year">
            <option>1975</option>
          </select>
        </div>
      </div>

      <div class="row">
        <label for="state">State:</label>
        <select id="state" name="state">
          <option>Ohio</option>
        </select>
      </div>

      <div class="row">
        <label for="country">Country:</label>
        <select id="country" name="country">
          <option>United States</option>
        </select>
      </div>
    </fieldset>

    <!-- Site Registration Section -->
    <fieldset>
      <legend>Site Registration</legend>

      <div class="row">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
      </div>

      <div class="row">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
      </div>

      <div class="row">
        <label for="re_password">Retype password:</label>
        <input type="password" id="re_password" name="re_password">
      </div>

      <div class="row">
        <label for="email">Email address:</label>
        <input type="text" id="email" name="email">
      </div>

      <div class="row">
        <label for="re_email">Retype email address:</label>
        <input type="text" id="re_email" name="re_email">
      </div>
    </fieldset>

    <!-- Submit Button -->
    <div class="submit-container">
      <input type="submit" value="Submit">
    </div>

  </form>
</div>

</body>
</html>
