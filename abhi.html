<!DOCTYPE html>
<html>
<head>
    <title>College Tech Fest</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0072ed; color: white; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #36bd36; color: white; border: none; cursor: pointer; font-weight: bold; }
        h2 {
            text-align: center;
            color: #e5e8ed;
            padding:30px;
            background-color: #0f6ee2;
            border-color:rgb(227, 10, 10) ;
            
        }
        h3 {
            background-color: #0f6ee2;
            
            border-color: rgb(0, 0, 0);
            color: #ccc;
        }
        th{
            background-color: #79b487;
            color: rgb(1, 1, 1);
            border-color: black;
        }
        td{
            background-color: antiquewhite;
            border-color: black;
        }
        label{
            
        }
        input{
            background-color: antiquewhite;
            border-color: rgb(0, 0, 0);
        }
        option{
            background-color: antiquewhite;
        }
       select{
        background-color: antiquewhite;
        border-color: black;
       }
      button{
        border-color: black;
      }
    </style>
</head>
<body>

    <h2><u>College Tech Fest 2026</u></h2>

    <!-- 1. Banner -->
    <div class="box">
        <img src="https://unsplash.com" alt="Banner">
    </div>

    <!-- 2. Table Schedule -->
    <div class="box">
        <h3><u>Event Schedule :-</u></h3>
        <table>
            <tr>
                <th>Time</th>
                <th>Event</th>
            </tr>
            <tr>
                <td>10:00 AM</td>
                <td>Coding Contest</td>
            </tr>
            <tr>
                <td>02:00 PM</td>
                <td>Web Design Showdown</td>
            </tr>
        </table>
    </div>

    <!-- 3. Registration Form -->
    <div class="box">
        <h3><u>Register Now:</u></h3>
        <form action="#" method="POST">
            <label>Name:</label>
            <input type="text" placeholder="Enter Name" required>
            
            <label>Email:</label>
            <input type="email" placeholder="Enter Email" required>
            
            <label>Select Event:</label>
            <select required>
                <option value="">Choose...</option>
                <option value="coding">Coding</option>
                <option value="design">Web Design</option>
            </select>
            
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
